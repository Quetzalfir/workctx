schema_version: 1
skills:
  - id: bootstrap-session
    side_effect_class: read_only
  - id: capture-browser-evidence
    side_effect_class: external_read
    notes: Reads an already-authenticated browser session strictly read-only; the only writes are local capture files and their inbox registration.
  - id: close-session
    side_effect_class: local_mutation
  - id: create-work-order
    side_effect_class: local_mutation
  - id: curate-knowledge
    side_effect_class: local_mutation
  - id: draft-replies
    side_effect_class: local_proposal
    notes: Drafts only; sending or publishing is outside this skill.
  - id: investigate-system
    side_effect_class: external_read
    notes: Connector use is optional, scoped, and read-only; persistence requires a separate local mutation workflow.
  - id: lead-implementation
    side_effect_class: local_mutation
    notes: Integration is local; remote pushes, merges, and publication are outside this skill.
  - id: manage-tasks
    side_effect_class: local_mutation
  - id: migrate-legacy-context
    side_effect_class: local_mutation
    notes: Writes only to the selected destination context and never changes the legacy source.
  - id: process-evidence
    side_effect_class: local_mutation
    notes: May create an outbox draft but never sends or publishes it.
  - id: review-work-order
    side_effect_class: local_mutation
  - id: trace-context
    side_effect_class: read_only
  - id: validate-context
    side_effect_class: read_only
    notes: Reports repair or rebuild actions as separate local-mutation proposals.
